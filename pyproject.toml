[project]
name = "english-german-translator"
version = "0.1.0"
description = "Transformer implementation from scratch"
authors = [
    {name = "Pedro Moy",email = "pedrohenriquemoy21@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "tokenizers (>=0.21.0,<1.0.0)",
    "datasets (>=5.1.0,<6.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "tokenizer (>=3.7.0,<4.0.0)",
    "jaxtyping (>=0.3.11,<0.4.0)",
    "beartype (>=0.23.1,<0.24.0)",
    "einops (>=0.8.2,<0.9.0)"
]

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]