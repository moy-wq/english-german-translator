[project]
name = "english-german-translator"
version = "0.1.0"
description = "Transformer implementation from scratch"
authors = [
    {name = "Pedro Moy",email = "pedrohenriquemoy21@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "torch (>=2.14.1,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "tokenizers (>=0.23.3,<0.24.0)",
    "datasets (>=5.1.0,<6.0.0)"
]

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
